name: Continuous integration and container publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  python-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package and test runner
        run: python3 -m pip install . "pytest>=9,<10"

      - name: Run offline Python tests
        run: python3 -m pytest -q -m "not postgres"

      - name: Run deterministic offline Agent eval
        run: PYTHONPATH=src python3 scripts/run_offline_eval.py

      - name: Check OpenAPI contract
        run: python3 scripts/export_openapi.py --check

      - name: Compile Python sources
        run: python3 -m compileall -q src tests scripts

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REELOOM_TEST_POSTGRES_DSN: postgresql://reeloom:reeloom-ci@127.0.0.1:5432/reeloom
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reeloom
          POSTGRES_USER: reeloom
          POSTGRES_PASSWORD: reeloom-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reeloom -d reeloom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package and test runner
        run: python3 -m pip install . "pytest>=9,<10"

      - name: Run isolated PostgreSQL tests
        run: python3 scripts/run_postgres_tests.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked Web dependencies
        run: npm ci

      - name: Lint Web sources
        run: npm run lint

      - name: Type-check Web sources
        run: npm run typecheck

      - name: Run Web unit tests
        run: npm test

      - name: Build Web application
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REELOOM_TEST_POSTGRES_DSN: postgresql://reeloom:reeloom-ci@127.0.0.1:5432/reeloom
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reeloom
          POSTGRES_USER: reeloom
          POSTGRES_PASSWORD: reeloom-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reeloom -d reeloom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create the Python E2E environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install .

      - name: Install locked Web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web

      - name: Run browser journeys
        run: npm run e2e
        working-directory: web

  container-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build container for runtime contract tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: reeloom:runtime-contract
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test fixed runtime binary contracts
        run: |
          docker run --rm \
            --env REELOOM_CONTAINER_CONTRACTS=1 \
            --volume "${{ github.workspace }}/tests/container:/contracts:ro" \
            --entrypoint python \
            reeloom:runtime-contract \
            /contracts/test_runtime_binaries.py -v

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - python-offline
      - postgres
      - web
      - browser
      - container-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
