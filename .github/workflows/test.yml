name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run the offline suite
        run: uv run pytest -q -m "not postgres and not binaries"

      - name: Compile sources
        run: uv run python -m compileall -q src tests scripts

  # Tests that drive real external binaries (7-Zip, ffmpeg/ffprobe) run in
  # their own job with REELOOM_TEST_REQUIRE_BINARIES=1: a broken toolchain
  # install fails the job instead of silently skipping the tests.
  python-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REELOOM_TEST_REQUIRE_BINARIES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install 7-Zip and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full ffmpeg

      - name: Run the real-binary suite
        run: uv run pytest -q -m binaries

  python-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REELOOM_TEST_POSTGRES_DSN: postgresql://reeloom:reeloom-ci@127.0.0.1:5432/reeloom
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reeloom
          POSTGRES_USER: reeloom
          POSTGRES_PASSWORD: reeloom-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reeloom -d reeloom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run the PostgreSQL suite
        run: uv run pytest -q -m postgres

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Single aggregate gate for branch protection: mark "CI passed" as the one
  # required status check, so adding or renaming test jobs never needs a
  # branch-protection update. `if: always()` keeps it running (and failing)
  # even when an upstream job fails or is skipped.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    if: always()
    needs:
      - python-offline
      - python-binaries
      - python-postgres
      - web

    steps:
      - name: Fail unless every test job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more test jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
