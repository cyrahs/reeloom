[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reeloom"
version = "2.0.0"
description = "Agent-native media organizer for anime, TV series and movies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "grpcio>=1.76,<2",
    "httpx>=0.27,<1",
    "protobuf>=6.31,<7",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
reeloom = "reeloom.server.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.package-data]
"reeloom.server" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires an explicit REELOOM_TEST_POSTGRES_DSN",
    "binaries(tool): drives a real external binary (7z, ffmpeg); skipped when it is absent unless REELOOM_TEST_REQUIRE_BINARIES=1",
]
