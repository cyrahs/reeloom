services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reeloom
      POSTGRES_USER: reeloom
      POSTGRES_PASSWORD: ${REELOOM_POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reeloom -d reeloom"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REELOOM_DATABASE_URL: postgresql://reeloom:${REELOOM_POSTGRES_PASSWORD}@postgres:5432/reeloom
      REELOOM_ADMIN_TOKEN: ${REELOOM_ADMIN_TOKEN:?required}
      REELOOM_WORK_DIR: /var/lib/reeloom
    volumes:
      - reeloom-work:/var/lib/reeloom
      # Mounted at the same absolute path inside and out, so the paths you
      # type into the UI mean the same thing to the container. Inbound and
      # library must be on one filesystem: moves are renames, never copies.
      - ${REELOOM_MEDIA_ROOT:?required}:${REELOOM_MEDIA_ROOT:?required}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  reeloom-work:
